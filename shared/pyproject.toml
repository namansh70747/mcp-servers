[project]
name = "mcp-base"
version = "0.1.0"
description = "Shared foundation for the MCP suite: FastMCP factory + SQLite BaseStore + config/paths."
requires-python = ">=3.11"
dependencies = ["fastmcp>=2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcp_base"]
