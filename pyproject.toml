[project]
name = "mcp-suite"
version = "0.1.0"
description = "Naman's free, portable MCP server suite (one shared venv for all custom servers)."
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0",
    "mcp-base",
    # outreach pipeline
    "httpx>=0.27",
    "feedparser>=6.0",
    "beautifulsoup4>=4.12",
    # web scraper: main-content extraction + clean HTML->Markdown (both lazy-imported)
    "trafilatura>=1.6",
    "markdownify>=0.11",
    "dnspython>=2.6",
    "email-validator>=2.1",
    "jinja2>=3.1",
    # google / gmail
    "google-api-python-client>=2.0",
    "google-auth-oauthlib>=1.2",
    "google-auth-httplib2>=0.2",
    # artifact generators
    "python-pptx>=0.6",
    "python-docx>=1.1",
    "markdown>=3.6",
    "PyGithub>=2.3",
    "GitPython>=3.1",
    # code intelligence / freshness
    "watchdog>=4.0",
    "pathspec>=0.12",
    # env loading (auto-loads repo .env in mcp_base)
    "python-dotenv>=1.0",
]

# Root is a virtual aggregator: one .venv with every server's deps. Servers run via
# `uv run --project <root> python servers/<name>/server.py` and stay independent processes.
[tool.uv]
package = false

[tool.uv.sources]
mcp-base = { path = "shared", editable = true }

# Optional heavy extras for codeindex semantic search (install when wanted):
#   uv pip install sentence-transformers sqlite-vec
[dependency-groups]
semantic = ["sentence-transformers>=3.0", "sqlite-vec>=0.1"]
# Optional multi-language symbol extraction for codeindex (lazy; regex fallback when absent):
#   uv pip install tree-sitter tree-sitter-languages
code = ["tree-sitter>=0.21", "tree-sitter-language-pack>=0.7"]
# Lightweight LOCAL embeddings for semantic search (free, ~30MB, no torch) — preferred over
# the heavy `semantic` group:  uv sync --group embed
embed = ["model2vec>=0.3"]
# Optional headless browser for webscrape's render mode (JS/SPA sites). Heavy (~Chromium):
#   uv sync --group browser && uv run playwright install chromium
browser = ["playwright>=1.40"]
